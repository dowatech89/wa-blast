[project]
name = "wablast-agent"
version = "0.1.0"
description = "WABlast sender agent: runs GOWA and sends queued campaign messages from Supabase."
requires-python = ">=3.13"
dependencies = [
  "supabase",
  "httpx",
  "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "mypy", "vulture", "pyinstaller"]

[tool.uv]
# Only resolve releases at least two weeks old.
exclude-newer = "2026-10-13T00:00:00Z"
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["wablast"]
pythonVersion = "3.13"

[tool.mypy]
files = ["wablast", "tests"]
python_version = "3.13"
ignore_missing_imports = true
